name: CI Smoke Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write build output file
        run: |
          echo "demo-build artifact generated by CI smoke test" > demo-build.txt
          cat demo-build.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: demo-build.txt
          if-no-files-found: error
